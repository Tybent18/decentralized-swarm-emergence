[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "decentralized-swarm-emergence"
version = "1.0.0"
description = "Reproducible Stage One laboratory for decentralized swarm experiments"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.1,<2", "matplotlib>=3.9,<4", "numpy>=2,<3", "pettingzoo>=1.25,<2", "Pillow>=11,<13", "scipy>=1.14,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9"]

[project.scripts]
swarm-lab = "swarm_lab.cli:main"

[tool.setuptools]
packages = ["swarm_lab", "env", "metrics"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".baseline-venv", ".venv", "docs", "src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
