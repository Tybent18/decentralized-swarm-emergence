name: Evidence Export

on:
  workflow_dispatch:
    inputs:
      start_seed:
        description: "First seed in the new batch"
        required: true
        default: "10"
      seed_count:
        description: "Number of seeds to collect"
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Collect and rebuild exports
        run: >-
          python main.py collect
          --start-seed ${{ inputs.start_seed }}
          --seeds ${{ inputs.seed_count }}
          --output results/evidence-export
      - uses: actions/upload-artifact@v4
        with:
          name: stage-one-evidence-${{ github.run_number }}
          path: results/evidence-export
          retention-days: 90
