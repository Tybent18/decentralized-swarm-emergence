name: Stage One CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: python main.py collect --seeds 2 --output results/ci
      - uses: actions/upload-artifact@v4
        with:
          name: stage-one-evidence-${{ matrix.python-version }}
          path: results/ci
